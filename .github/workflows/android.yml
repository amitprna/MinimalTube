name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check source for credentials
        run: python3 scripts/check-secrets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check player speed transitions
        run: node scripts/test-player-speed.cjs
      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Build and check
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: minimaltube-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
